<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胖嘟嘟柴柴點餐平台 - 極簡風格</title>
    <!-- Google Fonts: Inter & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. 全域變數與基礎設定 (Minimalist Theme Variables)
           ========================================================================== */
        :root {
            --bg-main: #F8FAFC;         /* 全站微暖淺灰底色 */
            --bg-card: #FFFFFF;         /* 卡片純白背景 */
            --border-color: #E2E8F0;    /* 極細邊框顏色 */
            --border-hover: #CBD5E1;    /* 懸停邊框顏色 */
            
            --text-primary: #0F172A;     /* 主文字：高對比深灰/近黑 */
            --text-secondary: #475569;   /* 次要文字：中灰 */
            --text-muted: #94A3B8;       /* 靜音文字：淺灰 */
            
            --brand-primary: #0284C7;    /* 品牌主色：質感藍 */
            --brand-primary-hover: #0369A1;
            --brand-accent: #0F172A;     /* 深色按鈕/強調色 */
            
            --state-success-bg: #F0FDF4; /* 成功狀態淡綠底 */
            --state-success-text: #166534;
            --state-error-bg: #FEF2F2;   /* 錯誤狀態淡紅底 */
            --state-error-text: #991B1B;
            
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: 24px 16px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* ==========================================================================
           2. 頁首橫幅 (Hero Header) - 移除節慶圖案與背景
           ========================================================================== */
        .h24-hero {
            text-align: center;
            padding: 32px 16px 24px;
            margin-bottom: 24px;
        }

        .h24-hero h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }

        .h24-hero p {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* ==========================================================================
           3. 首頁公告區 (Announce Card) - 移除四角裝飾與柴柴圖示
           ========================================================================== */
        .announcement-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }

        .announcement-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .announcement-list {
            list-style: none;
        }

        .announcement-list li {
            position: relative;
            padding-left: 18px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .announcement-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--brand-primary);
            font-weight: bold;
        }

        /* 每日截止提醒 */
        .deadline-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #FFFBEB;
            border: 1px solid #FDE68A;
            color: #92400E;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 8px;
        }

        .deadline-badge svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* ==========================================================================
           4. 頁籤切換按鈕 (Tab Navigation)
           ========================================================================== */
        .tab-group {
            display: flex;
            background-color: #E2E8F0;
            padding: 4px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--bg-card);
            color: var(--text-primary);
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        /* ==========================================================================
           5. 表單區塊 (Form & Controls)
           ========================================================================== */
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            color: var(--text-primary);
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        /* 部門選擇 Badge 標籤風 */
        .dept-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }

        .dept-chip {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background-color: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dept-chip.active {
            background-color: var(--brand-accent);
            color: #FFFFFF;
            border-color: var(--brand-accent);
        }

        /* 按鈕樣式 */
        .btn-primary {
            width: 100%;
            padding: 12px 20px;
            background-color: var(--brand-primary);
            color: #FFFFFF;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--brand-primary-hover);
        }

        /* ==========================================================================
           6. 極簡浮動按鈕與頁尾 (Floating Elements & Footer)
           ========================================================================== */
        /* 返回頂部按鈕 */
        .back-to-top {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 40px;
            height: 40px;
            background-color: var(--brand-accent);
            color: #FFFFFF;
            border: none;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: opacity 0.2s, transform 0.2s;
            opacity: 0.8;
        }

        .back-to-top:hover {
            opacity: 1;
            transform: translateY(-2px);
        }

        /* 頁尾 */
        .site-footer {
            text-align: center;
            padding: 32px 0 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }

        /* 意見箱與管理登入按鈕 */
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .footer-link-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-decoration: underline;
            cursor: pointer;
        }

        .footer-link-btn:hover {
            color: var(--brand-primary);
        }

        /* ==========================================================================
           7. 彈出視窗 (Modal / Alert)
           ========================================================================== */
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(2px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 24px;
            width: 90%;
            max-width: 440px;
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .modal-header {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.25rem;
            color: var(--text-muted);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 頁首主視覺 (無雜亂節慶圖案) -->
        <header class="h24-hero">
            <h1>公旭 / 群旭 同仁點餐平台</h1>
            <p>輕鬆完成每日午餐預訂與查詢</p>
        </header>

        <!-- 首頁公告區 -->
        <section class="announcement-card">
            <div class="announcement-header">
                <span>📢 點餐公告與須知</span>
            </div>
            <ul class="announcement-list">
                <li>請於每日指定截止時間前完成送出，逾時系統將自動關閉。</li>
                <li>如需修改內容，請先至「查詢 / 取消訂單」撤銷後再重新下單。</li>
                <li>若有特殊的餐點客製需求，請填寫於「備註欄」。</li>
            </ul>
            <div class="deadline-badge">
                <svg viewBox="0 0 24 24"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16zm0 2C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm1-10h3a1 1 0 0 1 0 2h-4a1 1 0 0 1-1-1V7a1 1 0 0 1 2 0v5z"/></svg>
                <span>每日點餐截止時間：上午 10:30</span>
            </div>
        </section>

        <!-- 主要功能頁籤切換 -->
        <nav class="tab-group">
            <button class="tab-btn active" onclick="switchTab('order')">我要點餐</button>
            <button class="tab-btn" onclick="switchTab('query')">查詢 / 取消訂單</button>
        </nav>

        <!-- 點餐表單卡片 -->
        <main class="form-card" id="order-section">
            <div class="form-group">
                <label class="form-label" for="order-date">點餐日期</label>
                <input type="date" id="order-date" class="form-control">
            </div>

            <div class="form-group">
                <label class="form-label">選擇部門</label>
                <div class="dept-selector">
                    <button class="dept-chip active" type="button">公旭</button>
                    <button class="dept-chip" type="button">群旭</button>
                    <button class="dept-chip" type="button">管理部</button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="user-name">您的姓名</label>
                <input type="text" id="user-name" class="form-control" placeholder="請輸入全名">
            </div>

            <div class="form-group">
                <label class="form-label" for="meal-item">選擇餐點</label>
                <select id="meal-item" class="form-select">
                    <option value="">-- 請選擇今日餐點 --</option>
                    <option value="1">招牌雞腿飯</option>
                    <option value="2">排骨便當</option>
                    <option value="3">健康蔬食餐盒</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="user-note">備註說明 (選填)</label>
                <input type="text" id="user-note" class="form-control" placeholder="如：飯少、不辣、醬汁分開">
            </div>

            <button type="button" class="btn-primary" onclick="submitOrder()">確認送出訂單</button>
        </main>

        <!-- 頁尾 -->
        <footer class="site-footer">
            <div class="footer-links">
                <button class="footer-link-btn" onclick="openModal('feedback-modal')">柴柴意見箱</button>
                <span>•</span>
                <button class="footer-link-btn" onclick="openModal('admin-modal')">管理員登入</button>
            </div>
            <p>© 2026 胖嘟嘟柴柴點餐平台. All rights reserved.</p>
        </footer>

    </div>

    <!-- 極簡返回頂部按鈕 (SVG 向上箭頭) -->
    <button class="back-to-top" onclick="scrollToTop()" title="返回頂部">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 15l-6-6-6 6"/>
        </svg>
    </button>

    <!-- 範例 Modal 彈窗 -->
    <div class="modal-backdrop" id="feedback-modal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal('feedback-modal')">&times;</button>
            <div class="modal-header">柴柴意見箱</div>
            <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 16px;">有任何建議或想吃的店家，歡迎留言告訴我們！</p>
            <textarea class="form-control" rows="4" placeholder="請寫下您的寶貴意見..."></textarea>
            <button class="btn-primary" style="margin-top: 16px;" onclick="closeModal('feedback-modal')">送出意見</button>
        </div>
    </div>

    <script>
        // 頁籤切換邏輯
        function switchTab(tabName) {
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // 返回頂部
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Modal 邏輯
        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // 部門選擇 Chip 切換
        document.querySelectorAll('.dept-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.dept-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 送出訂單測試
        function submitOrder() {
            alert('訂單已成功送出！');
        }
    </script>
</body>
</html>
